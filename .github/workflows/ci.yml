name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: afiliados
          POSTGRES_PASSWORD: afiliados_dev
          POSTGRES_DB: afiliados_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U afiliados" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://afiliados:afiliados_dev@localhost:5432/afiliados_test
      DATABASE_URL: postgres://afiliados:afiliados_dev@localhost:5432/afiliados_test
      AUTH_SECRET: segredo-somente-para-ci-com-mais-de-32-caracteres
      APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
